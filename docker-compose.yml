services:
  postgres:
    image: postgres:16
    container_name: bozkurt-mobilya-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bozkurt_mobilya
      POSTGRES_USER: bozkurt_app
      POSTGRES_PASSWORD: dev_password_123
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: